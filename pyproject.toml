[project]
name = "jarvis2-0"
version = "0.1.0"
description = "Persian voice assistant for Windows with offline Vosk recognition"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "comtypes>=1.4.15",
    "edge-tts>=7.3.1,<8",
    "google-genai>=1.60.0,<2",
    "jdatetime>=5.2.0",
    "numpy>=2.4.1",
    "psutil>=7.2.0",
    "pycaw>=20251023",
    "python-dotenv>=1.2.1",
    "pyttsx3>=2.99",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "sounddevice>=0.5.4",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.18.0", "pillow>=12.1.0"]

[tool.uv]
environments = ["sys_platform == 'win32'"]
