assistant:
  language: fa
  wakeword: "جارویس"
  wakeword_aliases: ["جارویس", "جارویز", "جار ویس", "جرویس", "سرویس", "jarvis"]
  command_timeout: 15
  confidence_threshold: 85

audio:
  model_path: "models/small/vosk-fa"
  microphone_index: null
  microphone_sensitivity: 2.5
  silence_timeout: 1.2
  input_gain: 1.0
  command_grammar: true
  min_confidence: 0.55

