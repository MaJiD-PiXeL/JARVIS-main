# system: آفلاین؛ نیازمند صدای فارسی نصب‌شده در ویندوز.
tts:
  engine: edge
  voice: "fa-IR-FaridNeural"
  rate: "+0%"
  system_voice_id: ""

ai:
  enabled: true
  provider: gemini
  api_key: ""
  model: "gemini-3-flash-preview"

tasks:
